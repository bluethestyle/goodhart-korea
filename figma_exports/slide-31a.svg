<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Pretendard, -apple-system, sans-serif">
<rect width="1920" height="1080" fill="#FAFAF7"></rect>

<text x="80" y="58" font-size="24" font-weight="500" letter-spacing="0.65" font-family="JetBrains Mono, monospace" fill="#64748B">ACT 05 · 전환 — 전반부 종합</text>
<text x="1840" y="58" font-size="14" text-anchor="end" font-family="JetBrains Mono, monospace" letter-spacing="0.4" fill="#94A3B8">삽입 · 31 → 32 · 전환 1/3</text>
<text x="80" y="106" font-size="44" fill="#0F172A" font-weight="700" letter-spacing="-0.44">전반부 종합 — 세 분석 관점이 한 방향을 가리킨다</text>
<text x="80" y="142" font-size="22" fill="#64748B">행정 분류 대신 사업 형태로 본 집행 시점. 세 분석 관점의 발견을 한 화면에 모은다.</text>
<line x1="80" y1="168" x2="1840" y2="168" stroke="#CBD5E1"></line>
<rect x="80" y="250" width="560" height="366" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="80" y="250" width="4" height="366" fill="#334155" rx="2"></rect>
<text x="108" y="296" font-size="14" fill="#334155" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">관점 1 · 형태</text>
<text x="108" y="342" font-size="25" fill="#0F172A" font-weight="800">형태 (Shape)</text>
<text x="108" y="372" font-size="14" fill="#64748B" font-family="JetBrains Mono, monospace">TDA · UMAP · HDBSCAN</text>
<line x1="108" y1="392" x2="612" y2="392" stroke="#CBD5E1" stroke-width="1"></line>
<text x="108" y="472" font-size="50" fill="#334155" font-weight="800">4</text>
<text x="108" y="508" font-size="18" fill="#334155" font-weight="700">사업 체질 (archetype)</text>
<text x="108" y="550" font-size="15" fill="#64748B">1,557 세부사업을 월별 패턴으로</text>
<text x="108" y="578" font-size="15" fill="#64748B">자동 군집 — 행정 분류와 무관</text>
<rect x="680" y="250" width="560" height="366" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="680" y="250" width="4" height="366" fill="#C0392B" rx="2"></rect>
<text x="708" y="296" font-size="14" fill="#C0392B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">관점 2 · 단절</text>
<text x="708" y="342" font-size="25" fill="#0F172A" font-weight="800">단절 (Discontinuity)</text>
<text x="708" y="372" font-size="14" fill="#64748B" font-family="JetBrains Mono, monospace">RDD (회귀불연속)</text>
<line x1="708" y1="392" x2="1212" y2="392" stroke="#CBD5E1" stroke-width="1"></line>
<text x="708" y="472" font-size="50" fill="#C0392B" font-weight="800">×1.9</text>
<text x="708" y="508" font-size="18" fill="#334155" font-weight="700">12월 1일 집행 점프</text>
<text x="708" y="550" font-size="15" fill="#64748B">회계연도 말 결재 집중</text>
<text x="708" y="578" font-size="15" fill="#64748B">자산취득형(C1)은 ×3.4</text>
<rect x="1280" y="250" width="560" height="366" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="1280" y="250" width="4" height="366" fill="#B45309" rx="2"></rect>
<text x="1308" y="296" font-size="14" fill="#B45309" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">관점 3 · 주기</text>
<text x="1308" y="342" font-size="25" fill="#0F172A" font-weight="800">주기 (Cycle)</text>
<text x="1308" y="372" font-size="14" fill="#64748B" font-family="JetBrains Mono, monospace">FFT · Wavelet · NeuralProphet</text>
<line x1="1308" y1="392" x2="1812" y2="392" stroke="#CBD5E1" stroke-width="1"></line>
<text x="1308" y="472" font-size="50" fill="#B45309" font-weight="800">+554%</text>
<text x="1308" y="508" font-size="18" fill="#334155" font-weight="700">연주기 진폭 11년 강화</text>
<text x="1308" y="550" font-size="15" fill="#64748B">출연금형(C2) 분기·연말 주기</text>
<text x="1308" y="578" font-size="15" fill="#64748B">시간이 갈수록 진폭 확대</text>
<text x="960" y="666" font-size="21" fill="#0F172A" font-weight="700" text-anchor="middle">세 관점 모두 — 집행 시점이 회계연도 말에 집중됨을 가리킨다 (output 차원의 일관된 신호).</text>
<rect x="80" y="692" width="1760" height="92" fill="#FBEEEC" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="80" y="692" width="4" height="92" fill="#C0392B" rx="2"></rect>
<text x="108" y="730" font-size="14" fill="#C0392B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">전환 질문</text>
<text x="280" y="736" font-size="21" fill="#0F172A" font-weight="700">이 집행 시점 집중이 정책 결과(outcome)와 연관되는가? — 후반부에서 검정한다.</text>
<line x1="780" y1="842" x2="1140" y2="842" stroke="#CBD5E1"></line>
<text x="960" y="884" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">전반부는 집행 시점 집중을 세 방식으로 확인했다. 후반부는 그 집중과 결과의 <tspan fill="#C0392B">통계적 연관을 검정</tspan>한다.</text>
<text x="80" y="1035" font-size="20" fill="#64748B" font-family="JetBrains Mono, monospace" letter-spacing="0.55">ACT 05 · 전환 1/3</text>
<text x="1840" y="1035" font-size="18" fill="#64748B" text-anchor="end" font-style="italic">다음 — 집행률로 결과를 설명할 수 있는가  ↘</text>

</svg>