<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Pretendard, -apple-system, sans-serif">
<rect width="1920" height="1080" fill="#FAFAF7"></rect>
<text x="80" y="58" font-size="24" fill="#64748B" font-weight="500" font-family="JetBrains Mono, monospace" letter-spacing="0.65">ACT 05 · 진단 — Output vs Outcome</text>
<text x="1840" y="58" font-size="14" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono, monospace" letter-spacing="0.4">ACT 5 재구성 · 32</text>
<text x="80" y="106" font-size="44" fill="#0F172A" font-weight="700" letter-spacing="-0.44">집행률은 결과(outcome)를 설명하지 못한다</text>
<text x="80" y="142" font-size="22" fill="#64748B">집행률은 분야 간 거의 같은데(90%+), 결과와의 상관은 0.02–0.73 — 약 31배 차이.</text>
<line x1="80" y1="168" x2="1840" y2="168" stroke="#CBD5E1" stroke-width="1"></line>
<text x="110" y="212" font-size="14" fill="#64748B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">분야별 outcome 상관 강도 |r| (분야 평균) — 0.02 ~ 0.73, 약 31배 차이</text>
