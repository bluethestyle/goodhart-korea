<rect x="1180" y="206" width="660" height="156" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="1180" y="206" width="4" height="156" fill="#64748B" rx="2"></rect>
<text x="1208" y="246" font-size="14" fill="#64748B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">집행률이 보는 것 (OUTPUT)</text>
<text x="1208" y="288" font-size="21" fill="#334155">· 결재 시점   · 집행 금액   · 집행률</text>
<text x="1208" y="330" font-size="17" fill="#64748B">→ 평가지표에 직접 반영 (분야 간 거의 동일, 90%+)</text>
<rect x="1180" y="378" width="660" height="188" fill="#FBEEEC" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="1180" y="378" width="4" height="188" fill="#C0392B" rx="2"></rect>
<text x="1208" y="418" font-size="14" fill="#64748B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">보지 못하는 것 (OUTCOME)</text>
<text x="1208" y="460" font-size="21" fill="#334155">· 사업 품질   · 목표 달성도</text>
<text x="1208" y="494" font-size="21" fill="#334155">· 사회적 결과 (지니·기대수명·범죄율 등)</text>
<text x="1208" y="536" font-size="17" fill="#C0392B">→ 평가지표에 미포함 · 분야 단위로만 측정</text>
<rect x="1180" y="582" width="660" height="150" fill="#FEF6E4" stroke="#CBD5E1" stroke-width="1" rx="10"></rect>
<rect x="1180" y="582" width="4" height="150" fill="#B45309" rx="2"></rect>
<text x="1208" y="622" font-size="14" fill="#64748B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">측정 단위의 한계</text>
<text x="1208" y="660" font-size="19" fill="#334155">결과는 분야 단위로만 측정 — 사업 단위 미시결과</text>
<text x="1208" y="690" font-size="19" fill="#334155">(품질·단가)는 데이터 자체가 없다.</text>
<text x="1208" y="720" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">검정 범위 상세 → 부록 App-MED</text>
<line x1="780" y1="838" x2="1140" y2="838" stroke="#CBD5E1" stroke-width="1"></line>
<text x="960" y="880" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">집행률은 ‘썼는가’만 보는 output 지표 — <tspan fill="#C0392B">결과의 대리지표가 될 수 없다</tspan>.</text>
<text x="80" y="1035" font-size="20" fill="#64748B" font-family="JetBrains Mono, monospace" letter-spacing="0.55">ACT 05 · 진단</text>
<text x="1840" y="1035" font-size="18" fill="#64748B" text-anchor="end" font-style="italic">다음 — 결과와 연결되는 한 틈을 본다  ↘</text>
</svg>
