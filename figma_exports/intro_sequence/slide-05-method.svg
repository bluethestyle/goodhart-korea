<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Pretendard, -apple-system, BlinkMacSystemFont, sans-serif">
<rect width="1920" height="1080" fill="#FAFAF7"/>

<text x="80" y="110" font-size="44" fill="#0F172A" font-weight="700">어떻게 보았는가 — 데이터·검증·산출물</text>

<rect x="80" y="240" width="500" height="440" fill="#F4F1EA" stroke="#CBD5E1" stroke-width="1" rx="10"/>
<rect x="80" y="240" width="4" height="440" fill="#C0392B"/>
<text x="112" y="292" font-size="14" fill="#64748B" font-weight="600" font-family="monospace" letter-spacing="0.6">INPUT · 분석 자료</text>
<text x="112" y="376" font-size="56" fill="#0F172A" font-weight="800">21만</text>
<text x="112" y="416" font-size="18" fill="#64748B">activity-month cells</text>
<line x1="112" y1="446" x2="548" y2="446" stroke="#CBD5E1" stroke-width="1"/>
<text x="112" y="492" font-size="24" fill="#0F172A" font-weight="700">열린재정 월별 집행</text>
<text x="112" y="532" font-size="18" fill="#334155">2015–2025, 활동·부처·분야·</text>
<text x="112" y="562" font-size="18" fill="#334155">사업원형을 한 표로 묶는다.</text>


<rect x="710" y="240" width="500" height="440" fill="#F4F1EA" stroke="#CBD5E1" stroke-width="1" rx="10"/>
<rect x="710" y="240" width="4" height="440" fill="#C0392B"/>
<text x="742" y="292" font-size="14" fill="#64748B" font-weight="600" font-family="monospace" letter-spacing="0.6">METHOD · 검증 축</text>
<text x="742" y="376" font-size="56" fill="#0F172A" font-weight="800">3</text>
<text x="742" y="416" font-size="18" fill="#64748B">RDD · 군집 · Wavelet/PSD</text>
<line x1="742" y1="446" x2="1178" y2="446" stroke="#CBD5E1" stroke-width="1"/>
<text x="742" y="492" font-size="24" fill="#0F172A" font-weight="700">세 기준으로 교차</text>
<text x="742" y="532" font-size="18" fill="#334155">회계연도 경계·사업 형태·</text>
<text x="742" y="562" font-size="18" fill="#334155">시간 주기를 분리해 본다.</text>


<rect x="1340" y="240" width="500" height="440" fill="#F4F1EA" stroke="#CBD5E1" stroke-width="1" rx="10"/>
<rect x="1340" y="240" width="4" height="440" fill="#C0392B"/>
<text x="1372" y="292" font-size="14" fill="#64748B" font-weight="600" font-family="monospace" letter-spacing="0.6">OUTPUT · 산출물</text>
<text x="1372" y="376" font-size="56" fill="#0F172A" font-weight="800">3종</text>
<text x="1372" y="416" font-size="18" fill="#64748B">4분면 · Top-50 · 모니터링</text>
<line x1="1372" y1="446" x2="1808" y2="446" stroke="#CBD5E1" stroke-width="1"/>
<text x="1372" y="492" font-size="24" fill="#0F172A" font-weight="700">유형별 차등 접근으로</text>
<text x="1372" y="532" font-size="18" fill="#334155">확인 후보를 좁히고 다른</text>
<text x="1372" y="562" font-size="18" fill="#334155">접근의 근거로 잇는다.</text>

<rect x="80" y="712" width="540" height="64" fill="#F1F5F9" stroke="#CBD5E1" rx="10"/>
<text x="350.0" y="752" font-size="21" fill="#0F172A" font-weight="700" text-anchor="middle">원자료 패턴</text>
<path d="M636 744 L674 744" stroke="#64748B" stroke-width="2.5"/>
<path d="M674 744 l-12 -7 l0 14 z" fill="#64748B"/>
<rect x="690" y="712" width="540" height="64" fill="#F1F5F9" stroke="#CBD5E1" rx="10"/>
<text x="960.0" y="752" font-size="21" fill="#0F172A" font-weight="700" text-anchor="middle">유형별 검증</text>
<path d="M1246 744 L1284 744" stroke="#64748B" stroke-width="2.5"/>
<path d="M1284 744 l-12 -7 l0 14 z" fill="#64748B"/>
<rect x="1300" y="712" width="540" height="64" fill="#F1F5F9" stroke="#CBD5E1" rx="10"/>
<text x="1570.0" y="752" font-size="21" fill="#0F172A" font-weight="700" text-anchor="middle">활용 산출물</text>
<text x="960" y="850" font-size="26" fill="#0F172A" font-weight="700" text-anchor="middle">원자료에서 활용 산출물까지, 같은 패널 위에서 본다.</text>
<text x="960" y="902" font-size="17" fill="#64748B" text-anchor="middle">본 분석은 부정·비위를 단정하지 않는다 — 반복 패턴과 결과 격차로 점검 후보를 좁힌다.</text>
<text x="1840" y="1035" font-size="18" fill="#64748B" text-anchor="end" font-style="italic">읽기 전에, 세 가지만.  ↘</text>
<text x="80" y="1050" font-size="14" fill="#64748B" font-family="monospace">05 / 40</text>

</svg>
