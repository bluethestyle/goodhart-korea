<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Pretendard, -apple-system, BlinkMacSystemFont, sans-serif">
<rect width="1920" height="1080" fill="#FAFAF7"/>

<text x="80" y="110" font-size="44" fill="#0F172A" font-weight="700">집행률 100%, 이 숫자는 무엇을 보장하는가?</text>
<text x="80" y="154" font-size="22" fill="#64748B">회계 마감·평가 일정이 집행을 특정 월에 모은다.</text>
<rect x="80" y="240" width="1100" height="540" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="10"/>
<text x="116" y="288" font-size="14" fill="#64748B" font-weight="600" font-family="monospace" letter-spacing="0.6">사업당 100% 정규화 후 월별 집행 분포</text>
<line x1="140" y1="690" x2="1140" y2="690" stroke="#CBD5E1" stroke-width="1"/>
<rect x="157.5" y="655.6" width="48.3" height="34.4" fill="#CBD5E1" rx="3"/>
<text x="181.66666666666666" y="718" font-size="14" fill="#64748B" text-anchor="middle">1월</text>
