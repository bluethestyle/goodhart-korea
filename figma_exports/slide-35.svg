<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Pretendard, -apple-system, sans-serif">
<rect width="1920" height="1080" fill="#FAFAF7"></rect>
<text x="80" y="58" font-size="24" fill="#64748B" font-weight="500" font-family="JetBrains Mono, monospace" letter-spacing="0.65">EPILOGUE · 진입 — 처방의 지도</text>
<text x="1840" y="58" font-size="14" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono, monospace" letter-spacing="0.4">Slide 35 · Epilogue 진입</text>
<text x="80" y="106" font-size="44" fill="#0F172A" font-weight="700" letter-spacing="-0.44">처방은 이미 있다 — 본 분석은 ‘어디에’를 댄다</text>
<text x="80" y="142" font-size="22" fill="#64748B">Goodhart 대응책은 학계·해외에서 제시돼 왔다. 빠진 건 ‘어느 사업·체질에 적용하나’ — 그 타겟을 데이터로 채운다.</text>
