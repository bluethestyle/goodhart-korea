<text x="112" y="368" font-size="21" fill="#0F172A" font-weight="800">다년도 회계 — 단년 마감압력 제거</text>
<text x="112" y="394" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">英 Capital DEL · 美 USACE</text>
<text x="112" y="428" font-size="21" fill="#0F172A" font-weight="800">정산 시점 분산</text>
<text x="112" y="454" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">獨 분기정산 · 日 IPA·NEDO</text>
<text x="112" y="488" font-size="21" fill="#0F172A" font-weight="800">측정가능 업무에만 인센티브 금지</text>
<text x="112" y="514" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">Holmström–Milgrom 1991</text>
<text x="112" y="548" font-size="21" fill="#0F172A" font-weight="800">연말지출 상시 모니터링</text>
<text x="112" y="574" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">美 GAO · 英 NAO</text>
<text x="112" y="608" font-size="21" fill="#0F172A" font-weight="800">이론 토대 — ‘지표가 목표가 되면’</text>
<text x="112" y="634" font-size="15" fill="#64748B" font-family="JetBrains Mono, monospace">Goodhart 1975 · Campbell 1979</text>
