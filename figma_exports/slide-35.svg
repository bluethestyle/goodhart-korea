<text x="960" y="752" font-size="24" fill="#0F172A" font-weight="700" text-anchor="middle">도구를 발명하지 않는다 — <tspan fill="#C0392B">검증된 처방을, 데이터가 가리키는 곳에 댄다</tspan>.</text>
<text x="80" y="1035" font-size="20" fill="#64748B" font-family="JetBrains Mono, monospace" letter-spacing="0.55">EPILOGUE · 진입</text>
