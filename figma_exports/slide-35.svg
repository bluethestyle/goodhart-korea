<text x="112" y="256" font-size="14" fill="#64748B" font-weight="700" font-family="JetBrains Mono, monospace" letter-spacing="0.6">① 이미 제시된 대응책 — 레퍼런스</text>
<text x="112" y="308" font-size="21" fill="#0F172A" font-weight="800">결과중심 예산 · 다지표 평가</text>
